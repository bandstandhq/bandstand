name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm license:check
      - run: pnpm turbo run lint typecheck test build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bandstand/web exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@bandstand/web
      - run: pnpm turbo run test:e2e --filter=@bandstand/web

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bandstand
          POSTGRES_PASSWORD: bandstand
          POSTGRES_DB: bandstand
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Its default CMD (unlike MinIO's) already starts SMTP+web with no
      # extra args, same as postgres above — so unlike MinIO below, this can
      # be a plain services: container. Needed since emailChange.integration.test.ts
      # is the first integration test that actually calls sendMail().
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
    env:
      DATABASE_URL: postgres://bandstand:bandstand@localhost:5432/bandstand
      BETTER_AUTH_SECRET: ci-integration-test-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:5173
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ci-minio-test
      MINIO_SECRET_KEY: ci-minio-test-do-not-use-in-production
      MINIO_BUCKET: bandstand
      # 127.0.0.1, not localhost — nodemailer's SMTP connection failed
      # against ::1 (IPv6 loopback) in this job, which nothing listens on;
      # forcing IPv4 sidesteps that resolution order instead of relying on it.
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only needed so tsx's --env-file doesn't ENOENT — the job env above
      # already overrides every value that matters for these tests.
      - run: pnpm ensure-env
      - run: pnpm --filter @bandstand/server db:migrate
      # MinIO isn't declared as a `services:` container because its image's
      # default CMD is bare `minio` (no `server /data`), and job-level
      # `services:` has no field to override a container's command —
      # unlike postgres, which starts correctly with its own default CMD.
      - name: Start MinIO
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            minio/minio:latest server /data
          timeout 30 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
      - name: Create MinIO bucket
        run: |
          docker run --rm --network host --entrypoint sh minio/mc:latest -c "
            mc alias set local http://localhost:9000 '$MINIO_ACCESS_KEY' '$MINIO_SECRET_KEY' &&
            mc mb --ignore-existing local/$MINIO_BUCKET
          "
      - run: pnpm turbo run test:integration --filter=@bandstand/server
