name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm license:check
      - run: pnpm turbo run lint typecheck test build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bandstand/web exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@bandstand/web
      - run: pnpm turbo run test:e2e --filter=@bandstand/web

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bandstand
          POSTGRES_PASSWORD: bandstand
          POSTGRES_DB: bandstand
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://bandstand:bandstand@localhost:5432/bandstand
      BETTER_AUTH_SECRET: ci-integration-test-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only needed so tsx's --env-file doesn't ENOENT — the job env above
      # already overrides every value that matters for these tests.
      - run: pnpm ensure-env
      - run: pnpm --filter @bandstand/server db:migrate
      - name: TEMP debug - inspect DATABASE_URL as seen by a plain node process
        run: |
          node -e "
            const u = new URL(process.env.DATABASE_URL);
            console.log(JSON.stringify({
              protocol: u.protocol,
              user: u.username,
              passType: typeof u.password,
              passLen: u.password.length,
              host: u.hostname,
              port: u.port,
              db: u.pathname,
            }));
          "
      - run: pnpm turbo run test:integration --filter=@bandstand/server
